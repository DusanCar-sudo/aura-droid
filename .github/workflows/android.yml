name: Android

# Builds the app on every push and pull request: unit tests plus a debug APK you
# can download from the run page (Artifacts). A signed release APK is built too
# when the signing secrets exist (see HANDOFF.md, "Signing").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
      AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
      AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
      AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; only the licences need accepting.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aura-droid-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Signed release APK
        if: ${{ env.AURA_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$AURA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aura.jks"
          AURA_KEYSTORE="$RUNNER_TEMP/aura.jks" ./gradlew --no-daemon assembleRelease
          sha256sum app/build/outputs/apk/release/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ env.AURA_KEYSTORE_BASE64 != '' }}
        with:
          name: aura-droid-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
